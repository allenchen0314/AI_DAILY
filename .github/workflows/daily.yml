name: Daily AI News

on:
  schedule:
    # 每天 UTC 23:07 = 北京时间次日 07:07 (+8)
    # 选 :07 是为了避开 GitHub Actions 整点高峰排队
    - cron: "7 23 * * *"
  workflow_dispatch:  # 允许在 GitHub 网页手动触发,方便调试
    inputs:
      date:
        description: "目标日期 YYYY-MM-DD (留空则用昨天)"
        required: false
        default: ""

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run digest
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          TIMEZONE: Asia/Shanghai
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python -m src.main --date "${{ github.event.inputs.date }}"
          else
            python -m src.main
          fi
